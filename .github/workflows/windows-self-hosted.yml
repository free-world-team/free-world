name: Qinglan Demo Release Candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release-candidate:
    runs-on: [self-hosted, Windows, X64, unity]
    timeout-minutes: 180
    env:
      M10_EVIDENCE_ROOT: TestResults/QinglanDemo/G3.6/CI
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Verify locked Unity installation
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UNITY_PATH)) { throw 'UNITY_PATH is not configured on the runner.' }
          if (-not (Test-Path -LiteralPath $env:UNITY_PATH -PathType Leaf)) { throw "UNITY_PATH is invalid: $env:UNITY_PATH" }
          $locked = ((Get-Content ProjectSettings/ProjectVersion.txt | Select-String '^m_EditorVersion:').Line -split ':', 2)[1].Trim()
          $installed = Split-Path -Leaf (Split-Path -Parent (Split-Path -Parent $env:UNITY_PATH))
          if ($installed -ne $locked) { throw "Unity mismatch: project=$locked runner=$installed" }

      - name: EditMode
        shell: pwsh
        run: ./Scripts/test.ps1 -Platform EditMode -ResultsDirectory $env:M10_EVIDENCE_ROOT

      - name: PlayMode
        shell: pwsh
        run: ./Scripts/test.ps1 -Platform PlayMode -ResultsDirectory $env:M10_EVIDENCE_ROOT

      - name: Project validation
        shell: pwsh
        run: ./Scripts/validate.ps1 -LogPath "$env:M10_EVIDENCE_ROOT/validation.log"

      - name: G2.8 vertical slice
        shell: pwsh
        run: |
          $env:QINGLAN_G28_OUTPUT = "$env:M10_EVIDENCE_ROOT/vertical-slice.json"
          $p = Start-Process -FilePath $env:UNITY_PATH -ArgumentList @('-batchmode','-projectPath',(Get-Location).Path,'-executeMethod','Game.Editor.QinglanG28VerticalSliceCommand.Run','-logFile',"$env:M10_EVIDENCE_ROOT/vertical-slice.log") -PassThru -Wait -WindowStyle Hidden
          exit $p.ExitCode

      - name: G3.4 balance matrix
        shell: pwsh
        run: |
          $env:QINGLAN_G34_OUTPUT = "$env:M10_EVIDENCE_ROOT/balance-report.json"
          $p = Start-Process -FilePath $env:UNITY_PATH -ArgumentList @('-batchmode','-projectPath',(Get-Location).Path,'-executeMethod','Game.Editor.QinglanG34BalanceCommand.Run','-logFile',"$env:M10_EVIDENCE_ROOT/balance.log") -PassThru -Wait -WindowStyle Hidden
          exit $p.ExitCode

      - name: G3.5 formal CPU target
        shell: pwsh
        run: ./Scripts/run-qinglan-g35-performance.ps1 -Mode Cpu -UnityPath $env:UNITY_PATH -OutputDirectory $env:M10_EVIDENCE_ROOT

      - name: G3.6 compliance
        shell: pwsh
        run: ./Scripts/audit-qinglan-g36-compliance.ps1 -OutputPath "$env:M10_EVIDENCE_ROOT/compliance.json" -LogPath "$env:M10_EVIDENCE_ROOT/compliance.log"

      - name: Windows Development
        shell: pwsh
        run: ./Scripts/build-windows.ps1 -LogPath "$env:M10_EVIDENCE_ROOT/build-development.log" -EvidenceRoot $env:M10_EVIDENCE_ROOT

      - name: Windows Release
        shell: pwsh
        run: ./Scripts/build-windows-release.ps1 -LogPath "$env:M10_EVIDENCE_ROOT/build-release.log" -EvidenceRoot $env:M10_EVIDENCE_ROOT

      - name: Release player smoke
        shell: pwsh
        run: ./Scripts/run-player-smoke.ps1 -LogPath "$env:M10_EVIDENCE_ROOT/release-player.log" -ResultPath "$env:M10_EVIDENCE_ROOT/release-player.json" -SavePath "$env:M10_EVIDENCE_ROOT/release-player-save"

      - name: Verify source tree unchanged
        shell: pwsh
        run: |
          if (git diff --name-only) { throw 'Tracked working-tree changes were produced by CI.' }
          if (git diff --cached --name-only) { throw 'Staged changes were produced by CI.' }
          if (git ls-files --others --exclude-standard) { throw 'Untracked project files were produced by CI.' }

      - name: Upload evidence and players
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qinglan-demo-release-candidate-${{ github.sha }}
          path: |
            TestResults/QinglanDemo/G3.6/CI
            Builds/WindowsDevelopment
            Builds/WindowsRelease
